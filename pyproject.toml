[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repowarden"
version = "1.0.0"
description = "A dependency-free CLI that audits local Git repositories and creates readable project reports."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Xyraniz" }]
license = { text = "MIT" }
keywords = ["git", "developer-tools", "cli", "repository", "code-quality"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance"
]

dependencies = []

[project.scripts]
repowarden = "repowarden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
